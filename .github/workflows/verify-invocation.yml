name: Verify invocation axis

# Gate executável do eixo de invocação (ver docs/invocation-policy.md).
# Garante que toda skill é user-invoked ou model-invoked com as duas marcas em
# lockstep, que todo agents/openai.yaml existe, que as descrições user-invoked
# não têm gatilho de modelo, e que as marcas atravessam a cópia do installer.

on:
  push:
    paths:
      - 'agents/**'
      - 'scripts/verify-invocation.py'
      - 'scripts/test-reviewer-integrity.py'
      - 'scripts/test-installer-transport.mjs'
      - '.github/workflows/verify-invocation.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'scripts/verify-invocation.py'
      - 'scripts/test-reviewer-integrity.py'
      - 'scripts/test-installer-transport.mjs'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar eixo de invocação
        run: python3 scripts/verify-invocation.py
      - name: Testar gate determinístico do Reviewer
        run: python3 scripts/test-reviewer-integrity.py
      - name: Smoke test de transporte do installer
        run: node scripts/test-installer-transport.mjs
